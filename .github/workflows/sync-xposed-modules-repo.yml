name: Sync to Xposed Modules Repo

# 每次 push 到 main（或手动触发）时：
# 1. sync    → 把完整源码同步到 Xposed-Modules-Repo/dev.operit.fanqiehook
# 2. release → 在 CI 上构建 release APK（KEYSTORE_BASE64 固定签名），
#              发布到模块仓库 Release（tag: [versionCode]-[versionName]，已存在则覆盖更新）。
# 官方构建系统会监听模块仓库的 push 与 Release，自动更新 modules.lsposed.org 页面。
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建 APK 并发布 Release 到模块仓库（代码未变更时手动补发）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          path: source

      - name: Checkout Xposed modules repo
        uses: actions/checkout@v5
        with:
          repository: Xposed-Modules-Repo/dev.operit.fanqiehook
          token: ${{ secrets.XPOSED_REPO_TOKEN }}
          path: xposed-repo

      - name: Sync source files into modules repo
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gradle/' \
            --exclude='.idea/' \
            --exclude='.kotlin/' \
            --exclude='local.properties' \
            --exclude='*.log' \
            --exclude='release/' \
            --exclude='**/build/' \
            source/ xposed-repo/

      - name: Commit and push
        run: |
          cd xposed-repo
          git config user.name "afwfv"
          git config user.email "afwfv@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync from afwfv/FanqieHook @ ${GITHUB_SHA::7}"
            git push origin main
          fi

  # 每次 push 到 main 都会自动构建并发布，无需手动打 tag。
  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          # 需要完整历史以生成 release notes（git log 上次commit..HEAD）
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up fixed signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            [ -n "$KEYSTORE_PASSWORD" ] && echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            [ -n "$KEYSTORE_ALIAS" ] && echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            [ -n "$KEYSTORE_KEY_PASSWORD" ] && echo "KEYSTORE_KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using fixed signing keystore from KEYSTORE_BASE64"
          else
            echo "KEYSTORE_BASE64 not set, using default signing"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Read version from module.prop
        id: version
        run: |
          versionCode=$(grep '^versionCode=' app/src/main/resources/META-INF/xposed/module.prop | cut -d= -f2 | tr -d '\r')
          versionName=$(grep '^version=' app/src/main/resources/META-INF/xposed/module.prop | cut -d= -f2 | tr -d '\r' | sed 's/^v//')
          echo "tag=${versionCode}-${versionName}" >> "$GITHUB_OUTPUT"
          echo "versionName=${versionName}" >> "$GITHUB_OUTPUT"

      - name: Publish release on Xposed modules repo (upsert)
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          repo=Xposed-Modules-Repo/dev.operit.fanqiehook

          # 从旧 release notes 解析上次发布的 commit，用于生成本次变更日志
          last_sha=$(gh release view "$tag" --repo "$repo" --json body -q '.body' 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -1 || true)

          # 生成 release notes：上次发布以来的提交；无记录则取最近 15 条
          if [ -n "$last_sha" ] && [ "$last_sha" != "$GITHUB_SHA" ]; then
            { echo "Changes since \`${last_sha:0:7}\`:"; git log --oneline "$last_sha"..HEAD; } > RELEASE_NOTES.md
          else
            { echo "Recent changes:"; git log --oneline -15 HEAD; } > RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          echo "Built from \`$GITHUB_SHA\`" >> RELEASE_NOTES.md

          # 同名 tag 已存在则先删除再重建（保证模块中心始终指向最新构建）
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Tag $tag already exists, deleting and recreating..."
            gh release delete "$tag" --repo "$repo" --yes
          fi

          gh release create "$tag" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "$repo" \
            --title "FanqieHook v${{ steps.version.outputs.versionName }}" \
            --notes-file RELEASE_NOTES.md \
            --latest
