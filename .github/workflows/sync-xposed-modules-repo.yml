name: Sync to Xposed Modules Repo

# 源仓库每次更新（push 到 main / 打 v* tag / 手动触发）时：
# 1. sync    → 把完整源码同步到 Xposed-Modules-Repo/dev.operit.fanqiehook
# 2. release → 在 CI 上构建 APK（debug 签名），发布到模块仓库（tag: [versionCode]-[versionName]）
# 官方构建系统会监听模块仓库的 push 与 Release，自动更新 modules.lsposed.org 页面。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建 APK 并发布 Release 到模块仓库（手动补发）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          path: source

      - name: Checkout Xposed modules repo
        uses: actions/checkout@v5
        with:
          repository: Xposed-Modules-Repo/dev.operit.fanqiehook
          token: ${{ secrets.XPOSED_REPO_TOKEN }}
          path: xposed-repo

      - name: Sync source files into modules repo
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gradle/' \
            --exclude='.idea/' \
            --exclude='.kotlin/' \
            --exclude='local.properties' \
            --exclude='*.log' \
            --exclude='release/' \
            --exclude='**/build/' \
            source/ xposed-repo/

      - name: Commit and push
        run: |
          cd xposed-repo
          git config user.name "afwfv"
          git config user.email "afwfv@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync from afwfv/FanqieHook @ ${GITHUB_SHA::7}"
            git push origin main
          fi

  # 打 v* tag 或手动勾选 publish_release 时：
  # 在 CI 上构建 APK（release 类型使用 debug 签名，可直接安装），
  # 并发布到模块仓库 Release（官方 CI 依赖此 Release 更新模块中心）。
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up fixed signing keystore
        if: secrets.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Read version from module.prop
        id: version
        run: |
          versionCode=$(grep '^versionCode=' app/src/main/resources/META-INF/xposed/module.prop | cut -d= -f2)
          versionName=$(grep '^versionName=' app/src/main/resources/META-INF/xposed/module.prop | cut -d= -f2)
          echo "tag=${versionCode}-${versionName}" >> "$GITHUB_OUTPUT"
          echo "versionName=${versionName}" >> "$GITHUB_OUTPUT"

      - name: Publish release on Xposed modules repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            app/build/outputs/apk/release/app-release.apk \
            --repo Xposed-Modules-Repo/dev.operit.fanqiehook \
            --title "FanqieHook v${{ steps.version.outputs.versionName }}" \
            --notes "Auto-generated by afwfv/FanqieHook CI from ${{ github.sha }}" \
            --latest
