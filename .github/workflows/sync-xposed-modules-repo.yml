name: Sync to Xposed Modules Repo

# 每次 push 到 main（或手动触发）时：
# 1. sync    → 把完整源码同步到 Xposed-Modules-Repo/dev.operit.fanqiehook
# 2. release → 在 CI 上构建 release APK（KEYSTORE_BASE64 固定签名），
#              发布到模块仓库 Release（tag: [versionCode]-[versionName]，已存在则覆盖更新）。
# 官方构建系统会监听模块仓库的 push 与 Release，自动更新 modules.lsposed.org 页面。
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建 APK 并发布 Release 到模块仓库（代码未变更时手动补发）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          path: source

      - name: Checkout Xposed modules repo
        uses: actions/checkout@v5
        with:
          repository: Xposed-Modules-Repo/dev.operit.fanqiehook
          token: ${{ secrets.XPOSED_REPO_TOKEN }}
          path: xposed-repo

      - name: Sync source files into modules repo
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gradle/' \
            --exclude='.idea/' \
            --exclude='.kotlin/' \
            --exclude='local.properties' \
            --exclude='*.log' \
            --exclude='release/' \
            --exclude='**/build/' \
            source/ xposed-repo/

      - name: Commit and push
        run: |
          cd xposed-repo
          git config user.name "afwfv"
          git config user.email "afwfv@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync from afwfv/FanqieHook @ ${GITHUB_SHA::7}"
            git push origin main
          fi

  # 检查自上次构建以来是否有 app 本身（源码/资源/构建配置）变更。
  # 只有涉及 app 的变更才重新构建发布；纯 CI / 文档改动跳过构建。
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.app-changed.outputs.changed }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect app code changes
        id: app-changed
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          repo=Xposed-Modules-Repo/dev.operit.fanqiehook
          # 从模块仓库最新 release notes 解析上次构建的 commit
          last_sha=$(gh release view --repo "$repo" --json body -q '.body' 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -1 || true)
          if [ -z "$last_sha" ]; then
            echo "No previous release, will build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # app 相关文件在此区间是否有变化
          changed_files=$(git diff --name-only "$last_sha"..HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat)
          if [ -n "$changed_files" ]; then
            echo "App code changed:"
            echo "$changed_files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app code changes, skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # 每次 push 到 main 且 app 代码有变更时自动构建并发布；手动触发勾选 publish_release 可强制发布。
  release:
    needs: check
    if: needs.check.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          # 需要完整历史以生成 release notes（git log 上次commit..HEAD）
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up fixed signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            [ -n "$KEYSTORE_PASSWORD" ] && echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            [ -n "$KEYSTORE_ALIAS" ] && echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            [ -n "$KEYSTORE_KEY_PASSWORD" ] && echo "KEYSTORE_KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using fixed signing keystore from KEYSTORE_BASE64"
          else
            echo "KEYSTORE_BASE64 not set, using default signing"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Read version from module.prop
        id: version
        run: |
          versionCode=$(grep '^versionCode=' app/src/main/resources/META-INF/xposed/module.prop | cut -d= -f2 | tr -d '\r')
          versionName=$(grep '^version=' app/src/main/resources/META-INF/xposed/module.prop | cut -d= -f2 | tr -d '\r' | sed 's/^v//')
          echo "tag=${versionCode}-${versionName}" >> "$GITHUB_OUTPUT"
          echo "versionName=${versionName}" >> "$GITHUB_OUTPUT"

      - name: Publish release on Xposed modules repo (upsert)
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          repo=Xposed-Modules-Repo/dev.operit.fanqiehook

          # 从旧 release notes 解析上次发布的 commit，用于生成本次变更日志
          last_sha=$(gh release view "$tag" --repo "$repo" --json body -q '.body' 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -1 || true)

          # 从 CHANGELOG.md 读取更新说明：优先按当前版本号匹配「## x.x.x」段，其次「未发布」段
          changelog_section=""
          if [ -f CHANGELOG.md ]; then
            ver="${{ steps.version.outputs.versionName }}"
            # 1) 按版本号段读取（支持 ## 0.3.0、## v0.3.0、## 0.3.0 - 日期 等标题）
            changelog_section=$(awk -v v="$ver" '
              /^## / {
                t = $2; sub(/^v/, "", t);
                if (t == v) { flag = 1; next } else { flag = 0 }
              }
              flag { print }
            ' CHANGELOG.md 2>/dev/null | sed '/^[[:space:]]*$/d')
            # 2) 找不到对应版本段时，回退「未发布」段
            if [ -z "$changelog_section" ]; then
              changelog_section=$(awk '/^## 未发布$/{flag=1; next} /^## / && flag{flag=0} flag{print}' CHANGELOG.md 2>/dev/null | sed '/^[[:space:]]*$/d')
            fi
          fi

          if [ -n "$changelog_section" ]; then
            { echo "更新内容:"; echo "$changelog_section"; } > RELEASE_NOTES.md
          else
            # 回退：上次发布以来的全部提交（排除 merge）；无记录则取最近 15 条
            if [ -n "$last_sha" ] && [ "$last_sha" != "$GITHUB_SHA" ]; then
              log=$(git log --no-merges --oneline "$last_sha"..HEAD)
            else
              log=$(git log --no-merges --oneline -15 HEAD)
            fi

            # 过滤 CI/构建等内部提交（消息以 ci/chore/build/test 开头，或带 (ci) 作用域），保留面向用户的变更
            # 注意 git log --oneline 输出为 "hash 提交信息"，需跳过行首 hash 再匹配
            user_changes=$(echo "$log" | grep -viE '^[0-9a-f]+\s+(ci|chore|build|test)(\([^)]*\))?:|^[0-9a-f]+\s+[a-z]+\(ci\):' || true)

            # 无用户可见变更时给出提示
            if [ -z "$user_changes" ]; then
              echo "本次更新无面向用户的变更（仅内部维护更新）。" > RELEASE_NOTES.md
            else
              { echo "更新内容:"; echo "$user_changes"; } > RELEASE_NOTES.md
            fi
          fi
          echo "" >> RELEASE_NOTES.md
          echo "Built from \`$GITHUB_SHA\`" >> RELEASE_NOTES.md

          # 同名 tag 已存在则先删除再重建（保证模块中心始终指向最新构建）
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Tag $tag already exists, deleting and recreating..."
            gh release delete "$tag" --repo "$repo" --yes
          fi

          gh release create "$tag" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "$repo" \
            --title "FanqieHook v${{ steps.version.outputs.versionName }}" \
            --notes-file RELEASE_NOTES.md \
            --latest
